name: Assertzilla Playwright Java PR Workflow

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  verify-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set Up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: java --version

      - name: Verify Code Builds
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode validate

      - name: Unit Test
        run: PLAYWRIGHT_ENV_CONFIG=environment ./mvnw test

      - name: Publish Coverage Report
        uses: madrapps/jacoco-report@v1
        with:
          title: 📝 Coverage Report
          pass-emoji: ✅
          fail-emoji: ❌
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 80
          min-coverage-changed-files: 80
